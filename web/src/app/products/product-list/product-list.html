<header class="page-header">
  <h2>Products</h2>
  <a mat-flat-button routerLink="/products/new">New product</a>
</header>

@if (loading()) {
  <div class="state" role="status">
    <mat-progress-spinner diameter="36" mode="indeterminate" aria-label="Loading products" />
    <p>Loading products…</p>
  </div>
} @else if (error()) {
  <mat-card class="state" role="alert">
    <mat-card-content>
      <p>{{ error() }}</p>
      <button mat-stroked-button type="button" (click)="load()">Try again</button>
    </mat-card-content>
  </mat-card>
} @else if (products().length === 0) {
  <mat-card class="state">
    <mat-card-content>
      <p>No products yet.</p>
      <a mat-flat-button routerLink="/products/new">Create the first one</a>
    </mat-card-content>
  </mat-card>
} @else {
  <table mat-table [dataSource]="products()">
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef scope="col">Code</th>
      <td mat-cell *matCellDef="let product">{{ product.code }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef scope="col">Description</th>
      <td mat-cell *matCellDef="let product">{{ product.description }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
}
